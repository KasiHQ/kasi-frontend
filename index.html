    <!-- Generative Engine Optimization (GEO) & Schema.org JSON-LD Markup -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Kasi",
        "operatingSystem": "All",
        "applicationCategory": "BusinessApplication",
        "url": "https://www.usekasi.com",
        "image": "https://www.usekasi.com/kasi.png",
        "description": "Kasi is the AI agent that runs your whole sale inside the chat. It answers, negotiates, takes verified payment and arranges delivery.",
        "applicationSubCategory": "AI Agent & Operating System for Social Commerce",
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "NGN",
          "lowPrice": "15000",
          "highPrice": "40000",
          "offerCount": "6"
        },
        "featureList": [
          "24/7 Automated WhatsApp Sales Assistant (Your digital sales rep that never sleeps)",
          "Conversational Price Negotiations, Product Consulting, & Closing Deals",
          "Automated Parallel Multi-Rider Delivery Dispatching",
          "Instant Professional Invoices & Secure Paystack Payment Collection",
          "Real-Time Merchant Order & Fleet Logistics Kanban Dashboard"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Kasi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kasi is the AI agent and operating system for social commerce. It answers customer questions, recommends products, negotiates prices, issues checkout links, collects verified payment, and coordinates delivery dispatches across WhatsApp, Instagram, and more."
            }
          },
          {
            "@type": "Question",
            "name": "How does Kasi automate logistics and delivery?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kasi coordinates dispatches instantly. When an order is confirmed, Kasi asks the customer for delivery details, broadcasts availability alerts to all your saved logistics rider numbers in parallel, and assigns the fastest respondent immediately."
            }
          },
          {
            "@type": "Question",
            "name": "How do I get started with Kasi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can sign up directly at https://www.usekasi.com/signup to create your account, connect your WhatsApp number via QR code, set up your product catalog, and start automating sales in minutes."
            }
          },
          {
            "@type": "Question",
            "name": "How much does Kasi cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kasi offers flexible subscription plans starting from ₦15,000 to ₦40,000/month depending on your business volume and team size, with dedicated 24/7 AI sales automation and dispatch management."
            }
          }
        ]
      }
    </script>
